<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>404 · zoostats.app</title>
  <link rel="icon" type="image/png" sizes="32x32"   href="/icon-32.png" />
  <link rel="icon" type="image/png" sizes="128x128" href="/icon-128.png" />
  <link rel="icon" type="image/png" sizes="256x256" href="/icon-256.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="grain min-h-screen flex items-center" style="background: var(--color-bg); color: var(--color-ink);">
  <main class="mx-auto max-w-3xl px-6 py-24 w-full">
    <p class="mono text-xs uppercase tracking-[0.25em]" style="color: var(--color-ink-faint);">status · 404 · not_found</p>
    <h1 class="display mt-8 text-6xl md:text-8xl font-black tracking-[-0.04em] leading-[0.92]">
      The fox got<br>
      <span class="display-italic font-medium" style="color: var(--color-cpu);">lost.</span>
    </h1>
    <p class="mt-8 max-w-xl text-lg leading-relaxed" style="color: var(--color-ink-mute);">
      No tile pinned at this URL. Head back to the bar and try a different combination.
    </p>
    <div class="mt-10 flex gap-4 mono text-sm">
      <a href="/" class="px-4 py-2 rounded-full" style="background: var(--color-ink); color: var(--color-bg-deep);">↩ home</a>
    </div>
    <img class="pixel mt-16" src="/sprites/fox_3.png" width="64" height="64" alt="lost fox sprite"/>
  </main>
</body>
</html>
